name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :domain:test :importer:test --stacktrace

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KASSA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kassa.jks"
            echo "KASSA_KEYSTORE=$RUNNER_TEMP/kassa.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key secret; the APK will be signed with a throwaway debug key."
          fi

      - name: Build APK
        env:
          KASSA_KEYSTORE_PASSWORD: ${{ secrets.KASSA_KEYSTORE_PASSWORD }}
          KASSA_KEY_ALIAS: ${{ secrets.KASSA_KEY_ALIAS }}
          KASSA_KEY_PASSWORD: ${{ secrets.KASSA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Check the app cannot use the network
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          if "$AAPT" dump permissions app/build/outputs/apk/release/app-release.apk | grep -q "android.permission.INTERNET"; then
            echo "INTERNET permission found in the APK"; exit 1
          fi
          echo "No INTERNET permission."

      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas

      - uses: actions/upload-artifact@v4
        with:
          name: kassa-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v0.1.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "kassa-$VERSION.apk"
          gh release create "$VERSION" "kassa-$VERSION.apk" \
            --title "Kassa $VERSION" \
            --notes "Built from ${GITHUB_SHA::7}. Install over the previous version; your data stays."
