name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # SHA-256 of the Kassa release certificate. Every published APK must match, so updates always install in place.
  KASSA_CERT_SHA256: 6bcfac9641a5b727b9f24a2dfb7efa4dd59724130a026c82b79131567af0714f

# One run per commit. Push events can arrive late, so never let a late run cancel a newer one.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build_number: ${{ steps.number.outputs.n }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build number
        id: number
        run: |
          N=$(git rev-list --count HEAD)
          echo "KASSA_BUILD=$N" >> "$GITHUB_ENV"
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p ci-output
          ./gradlew :domain:test :importer:test --stacktrace 2>&1 | tee ci-output/tests.log

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KASSA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kassa.jks"
            echo "KASSA_KEYSTORE=$RUNNER_TEMP/kassa.jks" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::KASSA_KEYSTORE_BASE64 secret is missing. Releases must be signed with the Kassa key or they can't update the installed app."
            exit 1
          else
            echo "No signing key on this pull request build; using a throwaway debug key."
          fi

      - name: Build APK
        env:
          KASSA_KEYSTORE_PASSWORD: ${{ secrets.KASSA_KEYSTORE_PASSWORD }}
          KASSA_KEY_ALIAS: ${{ secrets.KASSA_KEY_ALIAS }}
          KASSA_KEY_PASSWORD: ${{ secrets.KASSA_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease --stacktrace 2>&1 | tee ci-output/build.log

      - name: Check the release is signed with the Kassa key
        if: github.event_name != 'pull_request'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}')
          echo "Signed with $CERT"
          if [ "$CERT" != "$KASSA_CERT_SHA256" ]; then
            echo "::error::APK is signed with $CERT, expected the Kassa release key."
            exit 1
          fi

      - name: Check the app cannot use the network
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          if "$AAPT" dump permissions app/build/outputs/apk/release/app-release.apk | grep -q "android.permission.INTERNET"; then
            echo "INTERNET permission found in the APK"; exit 1
          fi
          echo "No INTERNET permission."

      - uses: actions/upload-artifact@v4
        with:
          name: kassa-apk
          path: app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas

      # Build logs aren't readable from outside GitHub, so failures are attached to a draft release.
      - name: Save diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "diag-${{ github.run_id }}-${{ github.run_attempt }}" ci-output/* \
            --draft --title "Build diagnostics ${{ github.run_number }}" --notes "Failed build logs." || true

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kassa-apk

      - name: Fetch the last published release to test upgrading over it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list -R "${{ github.repository }}" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName' || true)
          if [ -n "$TAG" ]; then gh release download "$TAG" -R "${{ github.repository }}" -p "*.apk" -O previous.apk || true; fi
          ls -la

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: mv app-release.apk kassa.apk && bash .github/scripts/smoke.sh

      - name: Save screenshots and logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d ci-output ] || exit 0
          gh release create "ci-${{ github.run_id }}-${{ github.run_attempt }}" ci-output/* \
            --draft --title "Emulator check ${{ github.run_number }}" --notes "Screenshots and logcat from the emulator." || true

  publish:
    needs: [build, smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kassa-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Late runs for older commits must never publish over newer code.
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then echo "Not the newest commit on main; skipping."; exit 0; fi
          # A manual run and a push run can both build the same commit; publish it once.
          if gh api "repos/${{ github.repository }}/releases?per_page=30" --jq '.[] | select(.draft | not) | .body' | grep -q "${GITHUB_SHA::7}"; then
            echo "Already published ${GITHUB_SHA::7}"; exit 0
          fi
          VERSION="v0.2.${{ needs.build.outputs.build_number }}"
          mv app-release.apk "kassa-$VERSION.apk"
          gh release create "$VERSION" "kassa-$VERSION.apk" -R "${{ github.repository }}" \
            --title "Kassa $VERSION" \
            --notes "Built from ${GITHUB_SHA::7}. Install over the previous version; your data stays."
