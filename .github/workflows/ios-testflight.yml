# UNVERIFIED SKELETON. Needs an Apple Developer account ($99/yr) and these repo secrets before it can run:
#   IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROFILE_BASE64 (App Store provisioning profile),
#   IOS_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (App Store Connect API key).
# It has never been run. Expect to fix signing details on the first real attempt. Manual only; nothing triggers it.
name: ios-testflight
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Import signing certificate and profile
        env:
          CERT: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -e
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          echo "$CERT" | base64 --decode > cert.p12
          security import cert.p12 -k ci.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ci.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/kassa.mobileprovision"
      - name: Generate project and archive
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cd ios && xcodegen generate
          xcodebuild archive -project Kassa.xcodeproj -scheme Kassa -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Kassa.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Export and upload to TestFlight
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          cd ios
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          printf '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>%s</string><key>destination</key><string>upload</string></dict></plist>' "$TEAM" > export.plist
          xcodebuild -exportArchive -archivePath build/Kassa.xcarchive -exportOptionsPlist export.plist \
            -allowProvisioningUpdates -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
