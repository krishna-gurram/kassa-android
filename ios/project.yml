name: Kassa
options:
  bundleIdPrefix: app.kassa
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
    # The shared framework is built by Gradle (script phase below); the script needs to run outside Xcode's sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ONLY_ACTIVE_ARCH: YES
  configs:
    Debug:
      "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
      "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
    Release:
      "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/releaseFramework"
      "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
targets:
  Kassa:
    type: application
    platform: iOS
    sources:
      - path: Kassa
    info:
      path: Kassa/Info.plist
      properties:
        CFBundleDisplayName: Kassa
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kassa.money
        OTHER_LDFLAGS: "$(inherited) -framework KassaShared"
        TARGETED_DEVICE_FAMILY: "1,2"
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then TARGET=IosSimulatorArm64; else TARGET=IosArm64; fi
          if [ "$CONFIGURATION" = "Release" ]; then KIND=Release; else KIND=Debug; fi
          ./gradlew ":shared:link${KIND}Framework${TARGET}"
  KassaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KassaTests
    dependencies:
      - target: Kassa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kassa.money.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kassa:
    build:
      targets:
        Kassa: all
        KassaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KassaTests
