name: Kassa
options:
  bundleIdPrefix: app.kassa
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
    # The shared framework is built by Gradle (script phase below); the script needs to run outside Xcode's sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ONLY_ACTIVE_ARCH: YES
  configs:
    Debug:
      "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
      "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
    Release:
      "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/releaseFramework"
      "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
# SQLCipher (community edition, BSD-style license) as a prebuilt xcframework; `import SQLCipher`. Its notice must be shown in the
# app before release (see CLAUDE.md). `from` takes the newest 4.x release (4.20.0 when this was written).
packages:
  SQLCipher:
    url: https://github.com/sqlcipher/SQLCipher.swift.git
    exactVersion: 4.20.0
targets:
  Kassa:
    type: application
    platform: iOS
    sources:
      - path: Kassa
      # The licence texts Settings > Third-party notices shows (the same files Android bundles): SQLCipher's BSD-style notice and Apache 2.0.
      - path: ../app/src/main/assets/licences
        includes:
          - sqlcipher.txt
          - apache-2.0.txt
        buildPhase: resources
    info:
      path: Kassa/Info.plist
      properties:
        CFBundleDisplayName: Kassa
        UILaunchScreen: {}
        # App lock asks for Face ID (or Touch ID, or the passcode) through LocalAuthentication (Kassa/AppLock.swift).
        NSFaceIDUsageDescription: Kassa uses Face ID to unlock your data when App lock is on.
        # The .kassa backup file: an exported type for the extension "kassa", so the file picker offers it (Kassa/KassaTypes.swift).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.kassa.money.backup
            UTTypeDescription: Kassa backup
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - kassa
          - UTTypeIdentifier: app.kassa.money.mmbak
            UTTypeDescription: Money Manager backup
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mmbak
          - UTTypeIdentifier: app.kassa.money.sql
            UTTypeDescription: Cashew backup
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - sql
        # Open in Kassa: .kassa backups, Money Manager (.mmbak) and Cashew (.sql) files from Files or the share sheet. The file is copied
        # into the app (not opened in place), then read by the same import as a picked file (Kassa/AppModel+OpenFile.swift).
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Kassa backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - app.kassa.money.backup
          - CFBundleTypeName: Money Manager or Cashew backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - app.kassa.money.mmbak
              - app.kassa.money.sql
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kassa.money
        OTHER_LDFLAGS: "$(inherited) -framework KassaShared"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # What SQLCipher's README asks Swift projects to define so its C header declares the encryption calls.
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) SQLITE_HAS_CODEC=1"
    dependencies:
      - package: SQLCipher
        product: SQLCipher
      - sdk: Security.framework
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then TARGET=IosSimulatorArm64; else TARGET=IosArm64; fi
          if [ "$CONFIGURATION" = "Release" ]; then KIND=Release; else KIND=Debug; fi
          ./gradlew ":shared:link${KIND}Framework${TARGET}"
  KassaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KassaTests
      # The golden .kassa files Android's tests open too: the bundle gets plain.kassa, protected.kassa and newer.kassa.
      - path: ../app/src/test/resources/backup-golden
        buildPhase: resources
      # The demo backup and the figures worked out from its entries alone (demo.kassa, expected.json).
      - path: ../app/src/test/resources/backup-demo
        includes:
          - demo.kassa
          - expected.json
        buildPhase: resources
    dependencies:
      - target: Kassa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kassa.money.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kassa:
    build:
      targets:
        Kassa: all
        KassaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KassaTests
